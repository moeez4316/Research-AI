name: Deploy Supabase Functions

on:
  push:
    branches: [ main ]

jobs:
  deploy-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install supabase CLI
        run: npm i -g supabase
      - name: Deploy research function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF not set — skipping supabase deploy";
            exit 0;
          fi
          supabase functions deploy research --project-ref $SUPABASE_PROJECT_REF
      - name: Set function secrets (optional)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY not provided — skipping secrets set";
            exit 0;
          fi
          # Writes the secret for the project (requires SUPABASE_ACCESS_TOKEN)
          echo "$OPENROUTER_API_KEY" | supabase secrets set OPENROUTER_API_KEY --project-ref $SUPABASE_PROJECT_REF
