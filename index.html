<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nativelyai.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ask any research question and get a thorough, sourced report. The agent breaks it down, searches the web, cross-checks sources, and writes it up."
    />
    <title>Research Agent — Sourced answers to your questions</title>
    <script>
      // Apply theme before paint to avoid flash of wrong theme
      (function () {
        try {
          var theme = localStorage.getItem("theme") || "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
